name: Build Windows Screensaver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/win-x64

      - name: Upload screensaver artifact
        uses: actions/upload-artifact@v6
        with:
          name: TheReachScreensaver-win-x64
          path: |
            publish/win-x64/TheReachScreensaver.scr
            publish/win-x64/TheReachScreensaver.exe
          if-no-files-found: error
          compression-level: 0
